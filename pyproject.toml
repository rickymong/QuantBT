[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbt"
version = "0.1.0"
description = "A backtesting engine with statistical overfitting defenses (deflated Sharpe ratio, walk-forward, block bootstrap)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["quantbt*"]
